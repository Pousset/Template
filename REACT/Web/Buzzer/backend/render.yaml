services:
  # Backend API
  - type: web
    name: buzzmaster-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build && npm run migration:run:prod
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: buzzmaster-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /

databases:
  # PostgreSQL Database
  - name: buzzmaster-db
    plan: free
    databaseName: buzzmaster
    user: buzzmaster
