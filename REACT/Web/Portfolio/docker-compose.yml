services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: buzzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buzzer
      POSTGRES_PASSWORD: buzzer_password
      POSTGRES_DB: buzzer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzzer -d buzzer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buzzer-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://buzzer:buzzer_password@postgres:5432/buzzer_db
      PORT: 3000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buzzer-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
